# One-time completion: PyPI (8 wheels) and crates.io (3 crates) were published by
# release-v121-recovery.yml run 34363783550; its publish-npm job failed on npm's 2FA
# policy, so update-homebrew and finalize-release never ran. The five npm packages
# have since been published by hand from the exact certified tarballs. This workflow
# never publishes to PyPI, npm, or crates.io: it verifies every registry now carries
# the certified bytes, then finishes the release (Homebrew tap, GitHub release).
name: Complete Moonlab v1.2.1 release after manual registry publication
'on':
  workflow_dispatch:
    inputs:
      confirmation:
        description: Verify the certified v1.2.1 registries and finish the release
        required: true
        type: choice
        options:
        - finish-v1.2.1
permissions:
  actions: read
  contents: read
concurrency:
  group: release-refs/tags/v1.2.1
  cancel-in-progress: false
jobs:
  verify-registries:
    runs-on: ubuntu-22.04
    if: inputs.confirmation == 'finish-v1.2.1'
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        persist-credentials: false
        ref: refs/tags/v1.2.1
    - name: Pin the checkout to the certified v1.2.1 commit
      shell: bash
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "a15dabcf79a93b195ed062c6ed338cb4bc2c733b"
    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Resolve the exact candidate from the annotated tag
      id: candidate
      shell: bash
      run: |
        set -euo pipefail
        python3 - "v1.2.1" "$GITHUB_OUTPUT" <<'PY'
        from pathlib import Path
        import sys

        sys.path.insert(0, str(Path.cwd() / "scripts"))
        from validate_release_certificate import _tag_candidate_binding

        run_id, head = _tag_candidate_binding(Path.cwd(), sys.argv[1])
        with Path(sys.argv[2]).open("a", encoding="utf-8") as output:
            output.write(f"run-id={run_id}\nhead={head}\n")
        PY
        [[ "$(git rev-parse HEAD)" == "$(git rev-parse 'a15dabcf79a93b195ed062c6ed338cb4bc2c733b')" ]]
    - name: Query and validate immutable hosted run identity and complete jobs
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build-verify
        gh run view '${{ steps.candidate.outputs.run-id }}' \
          --repo '${{ github.repository }}' \
          --json databaseId,url,headSha,conclusion,event,workflowName,jobs \
          | jq '{databaseId,url,headSha,conclusion,event,workflowName,jobs:[.jobs[]|{name,conclusion}]}' \
          > build-verify/candidate-run.json
        python3 scripts/verify_release_candidate.py verify-run \
          --run-json build-verify/candidate-run.json \
          --run-id '${{ steps.candidate.outputs.run-id }}' \
          --head 'a15dabcf79a93b195ed062c6ed338cb4bc2c733b'
        [[ '${{ steps.candidate.outputs.head }}' == 'a15dabcf79a93b195ed062c6ed338cb4bc2c733b' ]]
    - name: Download the certified candidate manifest bound to the tag
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p build-verify/manifest
        gh run download '${{ steps.candidate.outputs.run-id }}' \
          --repo '${{ github.repository }}' --name release-candidate-manifest \
          --dir build-verify/manifest
        test -s build-verify/manifest/moonlab-release-candidate.json
    - name: Verify PyPI, crates.io, and npm carry the exact certified bytes
      shell: bash
      env:
        MANIFEST: build-verify/manifest/moonlab-release-candidate.json
      run: |
        set -euo pipefail
        python3 - "$MANIFEST" <<'PY'
        from pathlib import Path
        import hashlib
        import json
        import sys
        import urllib.parse
        import urllib.request

        manifest_path = Path(sys.argv[1])
        manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
        artifacts = {entry["kind"]: entry for entry in manifest["artifacts"]}

        HEADERS = {"User-Agent": "moonlab-release-v121-finish (+https://github.com/tsotchke/moonlab)"}

        def fetch_json(url):
            request = urllib.request.Request(url, headers=HEADERS)
            with urllib.request.urlopen(request, timeout=60) as response:
                return json.loads(response.read().decode("utf-8"))

        def fetch_bytes(url):
            request = urllib.request.Request(url, headers=HEADERS)
            with urllib.request.urlopen(request, timeout=120) as response:
                return response.read()

        errors = []

        # PyPI: moonlab 1.2.1 must list exactly the 8 certified wheels, byte-identical.
        wheel_kinds = sorted(kind for kind in artifacts if kind.startswith("wheel-"))
        if len(wheel_kinds) != 8:
            errors.append(f"certified manifest does not declare exactly 8 wheel artifacts: {wheel_kinds}")
        expected_wheels = {artifacts[kind]["filename"]: artifacts[kind]["sha256"] for kind in wheel_kinds}

        pypi = fetch_json("https://pypi.org/pypi/moonlab/1.2.1/json")
        pypi_files = pypi.get("urls") or []
        if len(pypi_files) != 8:
            errors.append(f"PyPI moonlab 1.2.1 does not list exactly 8 files, found {len(pypi_files)}")
        seen_wheels = set()
        for file_info in pypi_files:
            filename = file_info.get("filename")
            digest = (file_info.get("digests") or {}).get("sha256")
            if filename in seen_wheels:
                errors.append(f"PyPI listed {filename} more than once")
            seen_wheels.add(filename)
            expected = expected_wheels.get(filename)
            if expected is None:
                errors.append(f"PyPI file {filename} is not a certified v1.2.1 wheel")
            elif digest != expected:
                errors.append(f"PyPI file {filename} sha256 {digest} does not match certified {expected}")
        missing_wheels = set(expected_wheels) - seen_wheels
        if missing_wheels:
            errors.append(f"PyPI is missing certified wheel files: {sorted(missing_wheels)}")

        # crates.io: moonlab-sys, moonlab, moonlab-tui 1.2.1 checksums must match the
        # certified .crate sha256 values (publish_crate_exact_bytes.py uploads the
        # certified bytes verbatim, so the registry checksum equals the manifest).
        crate_kind_by_name = {
            "moonlab-sys": "rust-moonlab-sys",
            "moonlab": "rust-moonlab",
            "moonlab-tui": "rust-moonlab-tui",
        }
        for crate_name, kind in crate_kind_by_name.items():
            expected = artifacts[kind]["sha256"]
            data = fetch_json(f"https://crates.io/api/v1/crates/{crate_name}/1.2.1")
            version = data.get("version") or {}
            checksum = version.get("checksum")
            if checksum != expected:
                errors.append(
                    f"crates.io {crate_name} 1.2.1 checksum {checksum} does not match certified {expected}"
                )

        # npm: all five scoped packages, tarball bytes re-hashed and compared, since
        # the manual registry upload does not itself expose the uploaded sha256.
        npm_kind_by_package = {
            "@tsotchkecorp/moonlab": "npm-core",
            "@tsotchkecorp/moonlab-algorithms": "npm-algorithms",
            "@tsotchkecorp/moonlab-viz": "npm-viz",
            "@tsotchkecorp/moonlab-react": "npm-react",
            "@tsotchkecorp/moonlab-vue": "npm-vue",
        }
        for package_name, kind in npm_kind_by_package.items():
            expected = artifacts[kind]["sha256"]
            encoded = urllib.parse.quote(package_name, safe="")
            data = fetch_json(f"https://registry.npmjs.org/{encoded}")
            versions = data.get("versions") or {}
            version = versions.get("1.2.1")
            if version is None:
                errors.append(f"npm {package_name} has no published 1.2.1 version")
                continue
            tarball = (version.get("dist") or {}).get("tarball")
            if not tarball:
                errors.append(f"npm {package_name} 1.2.1 has no dist.tarball")
                continue
            payload = fetch_bytes(tarball)
            actual = hashlib.sha256(payload).hexdigest()
            if actual != expected:
                errors.append(
                    f"npm {package_name} 1.2.1 tarball sha256 {actual} does not match certified {expected}"
                )

        if errors:
            for error in errors:
                print(f"REGISTRY VERIFICATION FAILED: {error}", file=sys.stderr)
            sys.exit(1)

        print("PyPI, crates.io, and npm registries match the certified v1.2.1 manifest exactly.")
        PY
  update-homebrew:
    needs: verify-registries
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
        ref: refs/tags/v1.2.1
    - name: Materialize stable formula
      env:
        VERSION: 1.2.1
        TAG: v1.2.1
      shell: bash
      run: |
        source_url="https://github.com/tsotchke/moonlab/archive/refs/tags/${TAG}.tar.gz"
        sha256="$(curl -fsSL "$source_url" | shasum -a 256 | cut -d ' ' -f 1)"
        sed -i '' -E "s|url \".*\"|url \"${source_url}\"|" packaging/homebrew/moonlab.rb
        sed -i '' -E "s|sha256 \".*\"|sha256 \"${sha256}\"|" packaging/homebrew/moonlab.rb
        grep -F "url \"${source_url}\"" packaging/homebrew/moonlab.rb
        grep -F "sha256 \"${sha256}\"" packaging/homebrew/moonlab.rb
    - name: Prepare tap checkout
      id: prepare-tap
      env:
        GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        TAG: v1.2.1
      run: |
        set -euo pipefail
        gh auth setup-git
        gh repo clone tsotchke/homebrew-moonlab tap
        mkdir -p tap/Formula
        cp packaging/homebrew/moonlab.rb tap/Formula/moonlab.rb
        git -C tap config user.name "Moonlab Release Bot"
        git -C tap config user.email "actions@github.com"
        git -C tap add Formula/moonlab.rb
        git -C tap diff --cached --check
        # An empty stage means the tap already carries this exact url and
        # sha256, so there is nothing new to commit. brew still needs the
        # formula committed locally (brew tap clones ./tap and only sees
        # committed content), and it already is, from the prior commit
        # this same content was cloned from.
        if git -C tap diff --cached --quiet; then
          echo "tap already serves the ${TAG} formula, nothing to commit"
          echo "formula-changed=false" >> "$GITHUB_OUTPUT"
        else
          git -C tap commit -m "moonlab ${TAG}"
          echo "formula-changed=true" >> "$GITHUB_OUTPUT"
        fi
    - name: Audit and install formula from source
      run: |
        brew tap tsotchke/moonlab "$PWD/tap"
        brew audit --formula --strict tsotchke/moonlab/moonlab
        brew install --build-from-source tsotchke/moonlab/moonlab
        brew test tsotchke/moonlab/moonlab
    - name: Push formula to tap
      env:
        GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        TAG: v1.2.1
        FORMULA_CHANGED: ${{ steps.prepare-tap.outputs.formula-changed }}
      run: |
        set -euo pipefail
        if [[ "$FORMULA_CHANGED" != "true" ]]; then
          echo "tap already serves the ${TAG} formula, skipping push"
          exit 0
        fi
        git -C tap push origin HEAD:main
  finalize-release:
    needs:
    - verify-registries
    - update-homebrew
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Publish GitHub release only after every registry succeeds
      shell: bash
      run: |
        gh release edit "v1.2.1" --repo "${{ github.repository }}" --draft=false --latest
