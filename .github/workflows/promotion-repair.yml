name: Promotion Repair

# Re-runs the registry promotion legs of an already-tagged, already-certified
# release. Every published byte is downloaded from the sealed candidate run
# named by the annotated tag and re-verified against the immutable release
# manifest before any registry is touched. Each leg is idempotent, so a
# partially completed promotion can be finished by dispatching this workflow
# again.
#
# npm is the one exception, and it is deliberate. The sealed 1.2.0 tarballs were
# packed as @moonlab/quantum-{core,algorithms,viz,react,vue}, and the @moonlab
# npm scope is registered to an unrelated account and cannot be obtained. The
# scope is baked into the manifest name fields, the workspace dependency ranges,
# and every import specifier inside those tarballs, so no amount of retrying can
# publish them. f5f037b renamed the five packages to @tsotchkecorp/moonlab,
# -algorithms, -viz, -react, and -vue, and it is the only post-tag commit that
# touched bindings/javascript.
#
# Dispatch this workflow from repair/v1.2.0-npm, which is exactly v1.2.0 plus
# f5f037b (and the workflow commits): the C sources, the emscripten inputs, and
# the TypeScript sit at their certified tag state and only the package names
# differ. publish-npm therefore rebuilds the five packages from that tree and
# publishes them under the new names, and finalize records what npm serves
# instead of matching it to the certificate. Every non-npm leg still republishes
# the sealed bytes and is still held to the certificate exactly as before.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version whose registry promotion is being repaired
        required: true
        type: string
        default: "1.2.0"
      candidate-run-id:
        description: Release run that sealed the immutable candidate inventory
        required: true
        type: string
        default: "30495368813"
      candidate-head:
        description: Commit the sealed candidate was built from
        required: true
        type: string
        default: "4bf83a6c47e7f1c53db14fcb2a61053499fd82df"
      npm-tag:
        description: dist-tag to attach to the published npm packages
        required: true
        type: string
        default: latest

permissions:
  actions: read
  contents: read

concurrency:
  group: promotion-repair-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.classify.outputs.version }}
      tag: ${{ steps.classify.outputs.tag }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
      npm-tag: ${{ steps.classify.outputs.npm-tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
      CANDIDATE_HEAD: ${{ inputs.candidate-head }}
      NPM_TAG: ${{ inputs.npm-tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Classify the release identity and bind it to the annotated tag
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]] || {
            echo "version input is invalid: $VERSION" >&2
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || {
            echo "candidate-run-id input is invalid: $CANDIDATE_RUN_ID" >&2
            exit 1
          }
          [[ "$CANDIDATE_HEAD" =~ ^[0-9a-f]{40}$ ]] || {
            echo "candidate-head input is invalid: $CANDIDATE_HEAD" >&2
            exit 1
          }
          [[ "$NPM_TAG" =~ ^[a-z][a-z0-9-]*$ ]] || {
            echo "npm-tag input is invalid: $NPM_TAG" >&2
            exit 1
          }
          tag="v$VERSION"
          # The pushed annotated tag is the authority for what may be published.
          # The dispatch inputs may only restate the candidate run and head that
          # the tag already certifies; anything else is refused here.
          [[ "$(git cat-file -t "refs/tags/$tag")" == "tag" ]]
          [[ "$(git rev-parse "refs/tags/${tag}^{commit}")" == "$CANDIDATE_HEAD" ]]
          python3 - "$tag" <<'PY'
          from pathlib import Path
          import os
          import sys

          sys.path.insert(0, str(Path.cwd() / "scripts"))
          from validate_release_certificate import _tag_candidate_binding

          tag = sys.argv[1]
          run_id, head = _tag_candidate_binding(Path.cwd(), tag)
          expected_run = int(os.environ["CANDIDATE_RUN_ID"])
          expected_head = os.environ["CANDIDATE_HEAD"]
          if run_id != expected_run or head != expected_head:
              raise SystemExit(
                  f"tag {tag} binds candidate {run_id}@{head}, "
                  f"not {expected_run}@{expected_head}"
              )
          print(f"tag {tag} binds candidate run {run_id} at {head}")
          PY
          {
            echo "tag=$tag"
            echo "version=$VERSION"
            echo "npm-tag=$NPM_TAG"
            if [[ "$VERSION" =~ -(alpha|beta|rc)\.[0-9]+$ ]]; then
              echo "prerelease=true"
            else
              echo "prerelease=false"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Materialize the sealed candidate verifier from the annotated tag
        env:
          TAG: ${{ steps.classify.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          # RELEASE_ARTIFACT_SPECS is the filename-to-kind table the candidate
          # scanner matches the sealed inventory against, and f5f037b repointed
          # its five npm entries at the @tsotchkecorp tarball names the rebuild
          # produces. This branch carries that commit, so its copy of the table
          # no longer describes the sealed bytes, which are still named
          # moonlab-quantum-*.tgz and always will be.
          #
          # Verify the immutable candidate with the exact verifier the tag sealed
          # it with, taken from the annotated tag this run already bound itself
          # to. That keeps the sealed inventory held to the certificate without
          # forking the branch copy of the scripts away from master. The rebuilt
          # npm tarballs are a separate artifact set and are checked by
          # scripts/verify_npm_packages.mjs inside publish-npm.
          #
          # Take the whole directory rather than the two entry points: the
          # verifier imports validate_release_certificate, which in turn imports
          # moonlab_linux_portability and moonlab_source_identity as siblings, and
          # only the script's own directory lands on sys.path when it runs from
          # outside the tree.
          mkdir -p repair/sealed-scripts
          git archive "refs/tags/${TAG}" scripts \
            | tar -x --strip-components=1 -C repair/sealed-scripts
          test -f repair/sealed-scripts/verify_release_candidate.py
          test -f repair/sealed-scripts/validate_release_certificate.py

      - name: Query and validate immutable hosted run identity and complete jobs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair
          gh run view "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json databaseId,url,headSha,conclusion,event,workflowName,jobs \
            | jq '{databaseId,url,headSha,conclusion,event,workflowName,jobs:[.jobs[]|{name,conclusion}]}' \
            > repair/candidate-run.json
          python3 repair/sealed-scripts/verify_release_candidate.py verify-run \
            --run-json repair/candidate-run.json \
            --run-id "$CANDIDATE_RUN_ID" \
            --head "$CANDIDATE_HEAD"

      - name: Download only artifacts from the tag-bound candidate run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p repair/dist repair/manifest
          for artifact in \
            native-linux-x64 native-linux-arm64 native-macos-arm64 native-macos-x64 \
            native-windows-x64 native-windows-arm64 debian-amd64 debian-arm64 \
            python-linux-x64 python-linux-arm64 python-macos-arm64 python-macos-x64 \
            python-windows-x64 python-windows-arm64 npm-packages rust-crates; do
            gh run download "$CANDIDATE_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" --name "$artifact" --dir repair/dist
          done
          gh run download "$CANDIDATE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" --name release-candidate-manifest \
            --dir repair/manifest

      - name: Require exact byte-for-byte candidate reuse
        run: >-
          python3 repair/sealed-scripts/verify_release_candidate.py verify
          --dist repair/dist
          --manifest repair/manifest/moonlab-release-candidate.json
          --run-id '${{ inputs.candidate-run-id }}'
          --head '${{ inputs.candidate-head }}'
          --version '${{ inputs.version }}'

      - uses: actions/upload-artifact@v7
        with:
          name: repair-release-artifacts
          path: repair/dist/**
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: repair-sealed-verifier
          path: repair/sealed-scripts/**
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: repair-release-manifest
          path: repair/manifest/moonlab-release-candidate.json
          if-no-files-found: error
          retention-days: 7

  publish-npm:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      # The sealed 1.2.0 npm tarballs carry the unobtainable @moonlab scope in
      # their manifest name fields, their workspace dependency ranges, and every
      # import specifier inside them, so they are permanently unpublishable and
      # this job does not download them. It rebuilds instead, from the ref the
      # workflow was dispatched from: repair/v1.2.0-npm is the v1.2.0 tag plus
      # f5f037b, the only post-tag commit that touched bindings/javascript, so
      # the C sources the WASM module is compiled from and the TypeScript the
      # bundles are built from are byte-identical to the certified tag and only
      # the five package names differ. Dispatching from master instead would
      # compile post-tag C changes into a 1.2.0 artifact; do not do that.
      #
      # The build recipe below is lifted from release.yml's npm-packages job at
      # this same ref, so the rebuild runs the toolchain, the test suites, and
      # the pack-and-verify step the sealed candidate was produced by.
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.22

      - name: Build WASM BLAS
        run: bindings/javascript/packages/core/emscripten/build-clapack-wasm.sh

      - name: Install, build, and test workspace
        working-directory: bindings/javascript
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          # `pnpm test` (turbo) only reaches each package's WASM-free vitest unit
          # config; the core integration suite (vitest.integration.config.ts) is
          # what exercises the moonlab.wasm module this job just built and is
          # about to publish, so run it explicitly as well.
          pnpm test
          pnpm run test:integration

      - name: Pack and verify exact npm artifacts
        run: |
          set -euo pipefail
          scripts/package_npm.sh "$RUNNER_TEMP/npm"
          # Asserts the five manifests carry the @tsotchkecorp names at this
          # version, that no workspace dependency range escaped the rewrite, that
          # core ships dist/moonlab.wasm, and that a fresh consumer can install
          # all five tarballs and run them through ESM, CJS, and tsc --strict.
          node scripts/verify_npm_packages.mjs "$RUNNER_TEMP/npm"

      - name: Publish the rebuilt packages npm is still missing
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.verify.outputs.npm-tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          pack_dir="$RUNNER_TEMP/npm"

          # `npm view <name>@<version> <field>` exits 0 and prints nothing when the
          # package exists without that version, so resolve on output, not status.
          # --prefer-online defeats a packument cached before this run published.
          npm_field() {
            npm view "$1@$VERSION" "$2" --prefer-online 2>/dev/null || true
          }

          wait_for_npm() {
            local name="$1"
            for attempt in {1..30}; do
              if [[ -n "$(npm_field "$name" version)" ]]; then
                return 0
              fi
              echo "waiting for npm registry: ${name} ${VERSION} (attempt ${attempt}/30)"
              sleep 10
            done
            echo "npm did not serve ${name} ${VERSION} in time" >&2
            return 1
          }

          # Workspace directory, published name, and pack stem, stated explicitly
          # because core drops the -core suffix and is the unsuffixed
          # @tsotchkecorp/moonlab, so the three no longer derive from one stem.
          # Core is published first: the other four declare it as a dependency at
          # exactly this version.
          published=0
          for entry in \
            "core:@tsotchkecorp/moonlab:tsotchkecorp-moonlab" \
            "algorithms:@tsotchkecorp/moonlab-algorithms:tsotchkecorp-moonlab-algorithms" \
            "viz:@tsotchkecorp/moonlab-viz:tsotchkecorp-moonlab-viz" \
            "react:@tsotchkecorp/moonlab-react:tsotchkecorp-moonlab-react" \
            "vue:@tsotchkecorp/moonlab-vue:tsotchkecorp-moonlab-vue"; do
            package="${entry%%:*}"
            rest="${entry#*:}"
            name="${rest%%:*}"
            file="${rest##*:}-${VERSION}.tgz"
            artifact="${pack_dir}/${file}"
            test -f "$artifact"
            built="$(sha256sum "$artifact" | cut -d ' ' -f 1)"

            if [[ -n "$(npm_field "$name" version)" ]]; then
              echo "already published, skipping: ${name}@${VERSION}"
              rebuilt_here=0
            else
              # npm parses an un-prefixed spec as a registry name or a GitHub
              # owner/repo shorthand even when that relative path exists, so the
              # ./ prefix is required. It has to be a relative path for that, so
              # publish from inside the pack directory rather than prefixing ./
              # onto an absolute one.
              ( cd "$pack_dir" && npm publish "./$file" --tag "$NPM_TAG" --access public --provenance )
              published=$((published + 1))
              wait_for_npm "$name"
              rebuilt_here=1
            fi

            tarball="$(npm_field "$name" dist.tarball)"
            test -n "$tarball"
            curl -fsSL "$tarball" -o "${RUNNER_TEMP}/registry-${package}.tgz"
            served="$(sha256sum "${RUNNER_TEMP}/registry-${package}.tgz" | cut -d ' ' -f 1)"

            if [[ "$rebuilt_here" -eq 1 ]]; then
              # npm stores and serves an uploaded tarball verbatim, so the bytes
              # this run built and pushed have to come back unchanged. The
              # certificate is not the reference here: it seals the @moonlab
              # tarballs this job cannot publish.
              if [[ "$served" != "$built" ]]; then
                echo "REGISTRY DRIFT: ${name}@${VERSION} serves sha256 ${served}, this run published ${built}" >&2
                exit 1
              fi
              advertised="$(npm_field "$name" dist.shasum)"
              expected_sha1="$(sha1sum "$artifact" | cut -d ' ' -f 1)"
              if [[ "$advertised" != "$expected_sha1" ]]; then
                echo "REGISTRY DRIFT: ${name}@${VERSION} advertises shasum ${advertised}, this run published ${expected_sha1}" >&2
                exit 1
              fi
            else
              # An earlier dispatch published this version from its own rebuild.
              # npm versions are immutable, so those bytes are the release and
              # this run's rebuild is discarded rather than compared: the two
              # come from identical source but the toolchain is not bit
              # reproducible, so an equality check here would fail every rerun.
              echo "note: ${name}@${VERSION} predates this run; this run rebuilt ${built}"
            fi
            echo "verified ${name}@${VERSION} sha256=${served}"
          done
          echo "npm packages published by this run: ${published}"

  publish-rust:
    needs: verify
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          name: repair-release-artifacts
          path: dist

      - uses: actions/download-artifact@v7
        with:
          name: repair-release-manifest
          path: manifest

      # The sealed inventory still names its npm tarballs moonlab-quantum-*.tgz,
      # which this branch's RELEASE_ARTIFACT_SPECS no longer matches, so the
      # re-verification below runs the verifier the tag sealed the candidate
      # with. verify materialized it from the annotated tag. The crate bytes and
      # the certificate checks in this job are otherwise unchanged.
      - uses: actions/download-artifact@v7
        with:
          name: repair-sealed-verifier
          path: sealed-scripts

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install cargo for crates.io index polling
        run: |
          # Kept aligned with the release workflow's publish-rust toolchain; this
          # job only runs `cargo info`, which has no 1.90 dependency.
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0

      - name: Publish the certified crate bytes crates.io is still missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.verify.outputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate-run-id }}
          CANDIDATE_HEAD: ${{ inputs.candidate-head }}
        shell: bash
        run: |
          set -euo pipefail
          # Re-assert exact byte-for-byte identity of every promoted artifact,
          # including the three .crate tarballs, against the immutable candidate
          # manifest before touching crates.io. Fails closed on any drift.
          python3 sealed-scripts/verify_release_candidate.py verify \
            --dist dist \
            --manifest manifest/moonlab-release-candidate.json \
            --run-id "$CANDIDATE_RUN_ID" \
            --head "$CANDIDATE_HEAD" \
            --version "$VERSION"

          user_agent='moonlab-release-promotion (https://github.com/tsotchke/moonlab)'

          # The registry API is authoritative and never lags the way the sparse
          # index can, so idempotency is decided against the API, not the index.
          crate_published() {
            local crate="$1"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "User-Agent: ${user_agent}" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}")"
            [[ "$code" == "200" ]]
          }

          wait_for_crate() {
            local crate="$1"
            for attempt in {1..30}; do
              if cargo info "${crate}@${VERSION}" >/dev/null 2>&1; then
                return 0
              fi
              echo "waiting for crates.io index: ${crate} ${VERSION} (attempt ${attempt}/30)"
              sleep 10
            done
            echo "crates.io did not index ${crate} ${VERSION} in time" >&2
            return 1
          }

          # Ship the exact certified bytes. publish_crate_exact_bytes.py uploads
          # the .crate tarball verbatim through PUT /api/v1/crates/new and refuses
          # to send unless the bytes re-hash to the certified SHA-256 taken from
          # the promoted manifest. Nothing is re-packaged, so the published
          # tarball hash equals the release certificate.
          publish_exact() {
            local crate="$1"
            local artifact="dist/${crate}-${VERSION}.crate"
            test -f "$artifact"
            local sha
            sha="$(jq -er --arg f "${crate}-${VERSION}.crate" \
              '.artifacts[] | select(.filename == $f) | .sha256' \
              manifest/moonlab-release-candidate.json)"
            test -n "$sha"
            python3 scripts/publish_crate_exact_bytes.py publish \
              --crate "$artifact" --sha256 "$sha"
          }

          # crates.io stores the SHA-256 of the uploaded .crate as the version
          # checksum, so the registry can be held to the certificate directly.
          require_certified_checksum() {
            local crate="$1"
            local expected served
            expected="$(jq -er --arg f "${crate}-${VERSION}.crate" \
              '.artifacts[] | select(.filename == $f) | .sha256' \
              manifest/moonlab-release-candidate.json)"
            served="$(curl -fsS -H "User-Agent: ${user_agent}" \
              "https://crates.io/api/v1/crates/${crate}/${VERSION}" \
              | jq -er '.version.checksum')"
            if [[ "$served" != "$expected" ]]; then
              echo "REGISTRY DRIFT: crates.io ${crate} ${VERSION} checksum ${served}, certificate requires ${expected}" >&2
              exit 1
            fi
            echo "verified ${crate} ${VERSION} sha256=${served}"
          }

          publish_if_missing() {
            local crate="$1"
            if crate_published "$crate"; then
              echo "already published, skipping: ${crate} ${VERSION}"
            else
              publish_exact "$crate"
            fi
            wait_for_crate "$crate"
            require_certified_checksum "$crate"
          }

          publish_if_missing moonlab-sys
          publish_if_missing moonlab
          publish_if_missing moonlab-tui

  update-homebrew:
    needs: verify
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Materialize stable formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
        shell: bash
        run: |
          source_url="https://github.com/tsotchke/moonlab/archive/refs/tags/${TAG}.tar.gz"
          sha256="$(curl -fsSL "$source_url" | shasum -a 256 | cut -d ' ' -f 1)"
          sed -i '' -E "s|url \".*\"|url \"${source_url}\"|" packaging/homebrew/moonlab.rb
          sed -i '' -E "s|sha256 \".*\"|sha256 \"${sha256}\"|" packaging/homebrew/moonlab.rb
          grep -F "url \"${source_url}\"" packaging/homebrew/moonlab.rb
          grep -F "sha256 \"${sha256}\"" packaging/homebrew/moonlab.rb

      - name: Prepare tap checkout
        id: prepare-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh auth setup-git
          gh repo clone tsotchke/homebrew-moonlab tap
          mkdir -p tap/Formula
          cp packaging/homebrew/moonlab.rb tap/Formula/moonlab.rb
          git -C tap config user.name "Moonlab Release Bot"
          git -C tap config user.email "actions@github.com"
          git -C tap add Formula/moonlab.rb
          git -C tap diff --cached --check
          # An empty stage means the tap already carries this exact url and
          # sha256, so there is nothing new to commit. brew still needs the
          # formula committed locally (brew tap clones ./tap and only sees
          # committed content), and it already is, from the prior commit
          # this same content was cloned from.
          if git -C tap diff --cached --quiet; then
            echo "tap already serves the ${TAG} formula, nothing to commit"
            echo "formula-changed=false" >> "$GITHUB_OUTPUT"
          else
            git -C tap commit -m "moonlab ${TAG}"
            echo "formula-changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Audit and install formula from source
        run: |
          brew tap tsotchke/moonlab "$PWD/tap"
          brew audit --formula --strict tsotchke/moonlab/moonlab
          brew install --build-from-source tsotchke/moonlab/moonlab
          brew test tsotchke/moonlab/moonlab

      - name: Push formula to tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          FORMULA_CHANGED: ${{ steps.prepare-tap.outputs.formula-changed }}
        run: |
          set -euo pipefail
          if [[ "$FORMULA_CHANGED" != "true" ]]; then
            echo "tap already serves the ${TAG} formula, skipping push"
            exit 0
          fi
          git -C tap push origin HEAD:main

  finalize:
    needs: [verify, publish-npm, publish-rust, update-homebrew]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: repair-release-manifest
          path: manifest

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Capture the GitHub release state
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,assets > release.json

      - name: Capture the published tap formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -uo pipefail
          # A missing formula must be reported by the verifier below, not hidden
          # behind a failing step, so an unreadable tap yields an empty file.
          gh api repos/tsotchke/homebrew-moonlab/contents/Formula/moonlab.rb \
            -H "Accept: application/vnd.github.raw" > tap-formula.rb || : > tap-formula.rb

      - name: Independently verify every registry serves the certified bytes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request

          VERSION = os.environ["VERSION"]
          TAG = os.environ["TAG"]
          PRERELEASE = os.environ["PRERELEASE"] == "true"
          AGENT = "moonlab-release-promotion (https://github.com/tsotchke/moonlab)"

          with open("manifest/moonlab-release-candidate.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          artifacts = manifest["artifacts"]
          failures: list[str] = []

          # The certificate seals five npm tarballs packed as
          # @moonlab/quantum-{core,algorithms,viz,react,vue}. The @moonlab npm
          # scope belongs to an unrelated account and cannot be obtained, and the
          # scope is baked into those tarballs' manifest name fields, workspace
          # dependency ranges, and import specifiers, so those exact bytes can
          # never reach the registry. The npm leg therefore publishes a rebuild
          # from the certified v1.2.0 source plus f5f037b, the rename to
          # @tsotchkecorp, which is byte-different from the sealed tarballs by
          # construction.
          #
          # So for npm this job requires the new names to be live at this version
          # and records what the registry serves as a supplementary attestation,
          # rather than matching it against the certificate. Certificate sha256
          # equality stays mandatory for every other artifact: the PyPI wheels,
          # the three crates, the Homebrew source tarball, and the release assets
          # are all the sealed bytes and are held to the certificate below.
          NPM_REBUILD_NAMES = {
              "@moonlab/quantum-core": "@tsotchkecorp/moonlab",
              "@moonlab/quantum-algorithms": "@tsotchkecorp/moonlab-algorithms",
              "@moonlab/quantum-viz": "@tsotchkecorp/moonlab-viz",
              "@moonlab/quantum-react": "@tsotchkecorp/moonlab-react",
              "@moonlab/quantum-vue": "@tsotchkecorp/moonlab-vue",
          }
          npm_attestation: dict[str, str] = {}

          def fetch(url: str, binary: bool = False):
              request = urllib.request.Request(
                  url, headers={"User-Agent": AGENT, "Accept": "*/*"}
              )
              with urllib.request.urlopen(request, timeout=180) as response:
                  payload = response.read()
              return payload if binary else json.loads(payload.decode("utf-8"))

          def certified(prefix: str) -> list[dict]:
              return sorted(
                  (item for item in artifacts if item["kind"].startswith(prefix)),
                  key=lambda item: item["filename"],
              )

          wheels = certified("wheel-")
          try:
              pypi = fetch(f"https://pypi.org/pypi/moonlab/{VERSION}/json")
              served = {item["filename"]: item["digests"]["sha256"] for item in pypi["urls"]}
              if len(pypi["urls"]) != len(wheels):
                  failures.append(
                      f"PyPI moonlab {VERSION} serves {len(pypi['urls'])} files, "
                      f"the certificate has {len(wheels)}"
                  )
              for wheel in wheels:
                  name = wheel["filename"]
                  if name not in served:
                      failures.append(f"PyPI moonlab {VERSION} is missing {name}")
                  elif served[name] != wheel["sha256"]:
                      failures.append(
                          f"PyPI serves {name} as sha256 {served[name]}, "
                          f"the certificate requires {wheel['sha256']}"
                      )
          except urllib.error.HTTPError as error:
              failures.append(f"PyPI moonlab {VERSION} is not published (HTTP {error.code})")

          for package in certified("npm-"):
              sealed_name = package["package"]
              name = NPM_REBUILD_NAMES.get(sealed_name, sealed_name)
              try:
                  document = fetch(
                      f"https://registry.npmjs.org/{name.replace('/', '%2f')}/{VERSION}"
                  )
              except urllib.error.HTTPError as error:
                  failures.append(f"npm {name}@{VERSION} is not published (HTTP {error.code})")
                  continue
              if document.get("version") != VERSION:
                  failures.append(f"npm {name} does not resolve {VERSION}")
                  continue
              npm_attestation[name] = hashlib.sha256(
                  fetch(document["dist"]["tarball"], binary=True)
              ).hexdigest()

          for crate in certified("rust-"):
              name = crate["package"]
              try:
                  document = fetch(f"https://crates.io/api/v1/crates/{name}/{VERSION}")
              except urllib.error.HTTPError as error:
                  failures.append(
                      f"crates.io {name} {VERSION} is not published (HTTP {error.code})"
                  )
                  continue
              version = document["version"]
              if version.get("num") != VERSION:
                  failures.append(f"crates.io {name} does not resolve {VERSION}")
              if version.get("yanked"):
                  failures.append(f"crates.io {name} {VERSION} is yanked")
              if version.get("checksum") != crate["sha256"]:
                  failures.append(
                      f"crates.io {name} {VERSION} checksum {version.get('checksum')} "
                      f"does not match the certificate {crate['sha256']}"
                  )

          if not PRERELEASE:
              source_url = f"https://github.com/tsotchke/moonlab/archive/refs/tags/{TAG}.tar.gz"
              tarball_sha = hashlib.sha256(fetch(source_url, binary=True)).hexdigest()
              with open("tap-formula.rb", encoding="utf-8") as handle:
                  formula = handle.read()
              if not formula.strip():
                  failures.append(
                      "Homebrew tap tsotchke/homebrew-moonlab has no readable Formula/moonlab.rb"
                  )
              else:
                  if f'url "{source_url}"' not in formula:
                      failures.append(f"tap formula does not point at {source_url}")
                  if f'sha256 "{tarball_sha}"' not in formula:
                      failures.append(
                          f"tap formula does not carry the {TAG} tarball sha256 {tarball_sha}"
                      )

          with open("release.json", encoding="utf-8") as handle:
              release = json.load(handle)
          assets = {asset["name"] for asset in release["assets"]}
          expected_assets = {item["filename"] for item in artifacts} | {"SHA256SUMS"}
          missing_assets = sorted(expected_assets - assets)
          if missing_assets:
              failures.append(f"release {TAG} is missing assets: {missing_assets}")
          if not release["isDraft"]:
              print(f"release {TAG} is already published")

          if npm_attestation:
              print(f"npm rebuild attestation for {VERSION} (not certificate-matched):")
              for name, digest in sorted(npm_attestation.items()):
                  print(f"  - {name}@{VERSION} sha256={digest}")

          if failures:
              print(f"PROMOTION INCOMPLETE for {VERSION}; the GitHub release stays a draft:")
              for failure in failures:
                  print(f"  - {failure}")
              raise SystemExit(1)
          print(
              f"every non-npm registry serves the certified {VERSION} bytes, "
              f"and all {len(npm_attestation)} npm packages are live under their "
              "@tsotchkecorp names"
          )
          PY

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
